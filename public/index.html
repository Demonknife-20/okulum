<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3f5f1">
  <meta name="description" content="Okulum: okul müdürü, öğretmen ve öğrenciler için ödev, yoklama, not ve mesajlaşma sistemi.">
  <title>Okulum</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="boot" id="boot" role="status">Okulum yükleniyor…</div>

  <div class="public" id="public" hidden>
    <header class="public-top">
      <a class="brand" href="#/"><span class="brand-mark">o</span><span class="brand-name">okulum</span></a>
      <nav class="public-nav" aria-label="Genel menü">
        <a href="#/yardim" data-public="yardim">Kullanım</a>
        <a href="#/giris" class="btn ghost sm" data-public="giris">Öğretmen / Öğrenci</a>
        <a href="#/mudur-girisi" class="btn primary sm" data-public="mudur-girisi">Müdür girişi</a>
      </nav>
    </header>
    <main class="public-view" id="publicView"></main>
    <footer class="public-foot">Okulum · Okul yönetim sistemi</footer>
  </div>

  <div class="app" id="app" hidden>
    <aside class="sidebar" id="sidebar" aria-label="Ana menü">
      <a class="brand" href="#/overview"><span class="brand-mark">o</span><span class="brand-name">okulum</span></a>
      <div class="school-chip" id="schoolChip"></div>
      <nav class="nav" id="nav" aria-label="Sayfalar"></nav>
      <div class="sidebar-foot">
        <div class="me"><span class="avatar" id="meAvatar"></span><div class="me-copy"><strong id="meName"></strong><small id="meRole"></small></div></div>
        <div class="me-actions">
          <button class="btn ghost sm" type="button" data-action="account">Hesabım</button>
          <button class="btn ghost sm" type="button" data-action="logout">Çıkış</button>
        </div>
      </div>
    </aside>
    <div class="scrim" id="scrim" data-action="close-menu"></div>
    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" type="button" data-action="open-menu" aria-label="Menüyü aç" aria-controls="sidebar">☰</button>
        <p class="crumb" id="crumb"></p>
        <div class="top-actions">
          <button class="icon-btn" id="themeBtn" type="button" data-action="theme" aria-label="Temayı değiştir"></button>
        </div>
      </header>
      <section class="content" id="view"></section>
    </main>
  </div>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" id="modalBox" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head"><h2 id="modalTitle"></h2><button class="icon-btn" type="button" data-action="close-modal" aria-label="Kapat">×</button></div>
      <div id="modalBody"></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
