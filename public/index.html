<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Okulum</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="topbar-inner">
        <button class="icon-btn menu-btn" type="button" data-action="open-menu" aria-label="Menüsü aç" aria-controls="sidebar">☰</button>
        <a class="brand" href="#/" aria-label="Okulum ana sayfa">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          <span class="brand-text">Okulum</span>
        </a>
        <div class="top-actions">
          <button class="icon-btn" id="themeBtn" type="button" data-action="theme" aria-label="Temayı değiştir"></button>
          <button class="icon-btn" id="userBtn" type="button" data-action="user" aria-label="Kullanıcı"></button>
        </div>
      </div>
    </div>

    <div class="sidebar" id="sidebar" aria-label="Ana menü">
      <div class="sidebar-head">
        <div class="brand"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg><span>Okulum</span></div>
        <button class="icon-btn sm" type="button" data-action="close-menu" aria-label="Menü kapat">✕</button>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <button class="btn ghost sm" id="logoutBtn" type="button" data-action="logout">Çıkış yap</button>
      </div>
    </div>

    <div class="scrim" id="scrim" data-action="close-menu"></div>

    <main class="main">
      <header class="topbar mobile-only">
        <div class="topbar-inner">
          <button class="icon-btn menu-btn" type="button" data-action="open-menu" aria-label="Menüsü aç" aria-controls="sidebar">☰</button>
          <a class="brand" href="#/" aria-label="Okulum ana sayfa">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span class="brand-text">Okulum</span>
          </a>
          <div class="top-actions">
            <button class="icon-btn" id="themeBtn" type="button" data-action="theme" aria-label="Temayı değiştir"></button>
          </div>
        </div>
      </header>
      <div class="crumb" id="crumb"></div>
      <section class="content" id="view"></section>
    </main>
  </div>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" id="modalBox" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head"><h2 id="modalTitle"></h2><button class="icon-btn" type="button" data-action="close-modal" aria-label="Kapat">×</button></div>
      <div id="modalBody"></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
