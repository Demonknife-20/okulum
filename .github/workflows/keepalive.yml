# Render ücretsiz servisi ve Supabase ücretsiz projesi hareketsizlikte uyur/duraklar.
# Bu iş her 10 dakikada bir sağlık ucunu çağırarak ikisini de uyanık tutar.
# Adresi değiştirmek için GitHub deposunda Settings > Variables > SITE_URL tanımlayın.
name: Siteyi uyanık tut
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Sağlık kontrolü
        run: |
          URL="${{ vars.SITE_URL }}"
          URL="${URL:-https://okulum.onrender.com}"
          curl -fsS --max-time 120 "$URL/healthz" -o /dev/null && echo "Canlı: $URL"
